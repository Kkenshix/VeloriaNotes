/* ===== Veloria 6.8.1 UI Polish ===== */
:root{
  --sidebar:320px;--radius:14px;
  --text:#edf3fb;--muted:#95a3b8;--line:#263750;--panel:#0d1727;--panel2:#121f33;--panel3:#192943;
  --blue:#2f6fed;--blue2:#4a8dff;--danger:#ef5b66;--green:#39d49b;--amber:#f2aa45;
  --ease:cubic-bezier(.2,.8,.2,1)
}
body.light{--text:#132033;--muted:#64748b;--line:#d7e0eb;--panel:#fff;--panel2:#f4f7fb;--panel3:#e9eff8}
html,body{font-size:14px;line-height:1.45;letter-spacing:.002em}
button,input,textarea,select{font-size:14px}
.v-icon{width:18px;height:18px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.v-icon.sm{width:15px;height:15px}.v-icon.lg{width:21px;height:21px}
#sidebar{box-shadow:8px 0 35px rgba(2,6,23,.08)}
.brand{height:70px;gap:12px;padding:10px 16px}.brand img{width:42px;height:42px}.brand strong{font-size:18px;line-height:1.15;letter-spacing:-.01em}.brand small{font-size:11px;line-height:1.3;margin-top:4px;color:var(--muted)}
.workspace-btn{margin:12px 13px 9px;min-height:50px;padding:9px 12px;border-radius:13px;gap:10px;transition:border-color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease)}
.workspace-btn:hover{border-color:rgba(74,141,255,.65);background:var(--panel3);transform:translateY(-1px)}

.rich-block:has(.v690-inline-image[data-align="left"]),.rich-block:has(.v690-inline-image[data-align="right"]){display:block!important}

/* Folder selection is explicit and remains visible before a native drag-out. */
.gallery-item.selected{outline:2px solid #60a5fa!important;outline-offset:1px;box-shadow:0 0 0 3px rgba(96,165,250,.12)!important}
.gallery-item.selected::after{content:'✓';position:absolute;right:8px;top:8px;z-index:12;width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:13px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.v1-selection-count{height:34px;display:inline-flex;align-items:center;padding:0 8px;color:var(--muted);font-size:10px;font-weight:800}

/* Code blocks match the standalone editor: line numbers + dark monospace editing surface. */
.v1-code-shell{width:100%;height:clamp(300px,55vh,560px);display:grid;grid-template-columns:52px minmax(0,1fr);overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#020617;margin:2px 0 0}
.v1-code-lines{margin:0;padding:16px 9px;overflow:hidden;border-right:1px solid var(--line);background:#07101e;color:#64748b;text-align:right;font:12.5px/1.6 Consolas,"Cascadia Code",monospace;white-space:pre;user-select:none}
.v1-code-shell .v1-code-area{width:100%!important;height:100%!important;margin:0!important;padding:16px 18px!important;border:0!important;border-radius:0!important;resize:none!important;background:#020617!important;color:#dbeafe!important;font:13.5px/1.6 Consolas,"Cascadia Code",monospace!important;white-space:pre!important;overflow:auto!important;tab-size:2;outline:none!important}
.v1-code-shell .v1-code-area:focus{box-shadow:inset 0 0 0 1px rgba(96,165,250,.35)!important}
.light .v1-code-shell,.light .v1-code-shell .v1-code-area{background:#eef2f7!important;color:#172033!important}
.light .v1-code-lines{background:#e5eaf1;color:#64748b}
